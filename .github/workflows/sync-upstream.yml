name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *' # Automatically runs every 6 hours
  workflow_dispatch:      # Allows manual one-click trigger from GitHub Actions

permissions:
  contents: write

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Upstream
        run: |
          git remote add upstream https://github.com/mutonby/openshorts.git || git remote set-url upstream https://github.com/mutonby/openshorts.git
          git fetch upstream main
          git checkout main
          git merge upstream/main --no-edit || (git merge --abort && echo "::warning::Merge conflict with upstream - manual resolution required" && exit 1)
          git push origin main
